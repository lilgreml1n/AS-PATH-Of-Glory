<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AS-PATH OF GLORY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: one arcade screen centered on a dark field; key legend under it, touch pad on phones. Single dark look by choice. */
:root{
  --bg:#06070d; --panel:#0e1120; --ink:#e7ebf5; --dim:#8b93ad; --accent:#38e1ff; --lava:#ff5a1f; --rule:#1d2238;
  --display:"Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --body:"Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:12px; box-sizing:border-box; overflow:hidden;
}
.stage{width:min(100%, calc((100dvh - 150px) * 1.6), 1280px); position:relative}
canvas{display:block; width:100%; aspect-ratio:16/10; max-width:100%; border-radius:6px; background:#0a0c18;
  box-shadow:0 0 0 1px var(--rule), 0 20px 60px -20px rgba(255,90,31,.35), 0 0 80px -30px rgba(56,225,255,.25); touch-action:none}
.legend{display:flex; flex-wrap:wrap; gap:6px 18px; justify-content:center; color:var(--dim); font-size:13px; letter-spacing:.02em}
.legend b{color:var(--ink); font-weight:600}
kbd{font-family:var(--display); font-size:9px; padding:3px 5px; border:1px solid var(--rule); border-bottom-width:2px; border-radius:4px; color:var(--accent); background:var(--panel)}
.pad{display:none; gap:10px; width:min(100%, 520px)}
.pad button{flex:1; font-family:var(--display); font-size:12px; color:var(--ink); background:var(--panel); border:1px solid var(--rule);
  border-bottom:3px solid #2a3150; border-radius:10px; padding:18px 0; touch-action:none; user-select:none; -webkit-user-select:none}
.pad button.flap{flex:1.6; color:#0b0d06; background:var(--accent); border-color:#1f9fb8}
.pad button.throw{flex:1.2; color:#0b0d06; background:#ffd23f; border-color:#b8941f}
.pad button:active,.pad button.on{transform:translateY(2px); filter:brightness(1.2)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (pointer:coarse){ .pad{display:flex} .legend{display:none} }
</style>
</head>
<body>

<div class="stage"><canvas id="game" aria-label="AS-PATH OF GLORY game screen" tabindex="0"></canvas></div>
<div class="legend">
  <span><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> <b>steer</b></span>
  <span><kbd>SPACE</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> <b>flap</b> (tap it, don't hold)</span>
  <span><kbd>X</kbd> / <kbd>SHIFT</kbd> <b>throw lance</b></span>
  <span><kbd>P</kbd> <b>pause</b></span>
  <span><kbd>M</kbd> <b>mute</b></span>
</div>
<div class="pad" id="pad">
  <button id="bL" data-k="left" aria-label="Steer left">◀</button>
  <button id="bF" data-k="flap" class="flap" aria-label="Flap">FLAP</button>
  <button id="bR" data-k="right" aria-label="Steer right">▶</button>
  <button id="bT" data-k="throw" class="throw" aria-label="Throw lance">THROW</button>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = 960, H = 600, S = 2;
cv.width = W * S; cv.height = H * S; ctx.scale(S, S);

// ---------- tuning ----------
const G = 560, FLAP_V = 230, MAX_UP = -320, MAX_DOWN = 420;
const LAVA_TOP = 574, GAP_L = 250, GAP_R = 710, LANCE = -8;
const ACC = '#38e1ff';
const TIERS = {
  bounder: { name:'Scalper Bot',   color:'#ff3b4e', pts:500,  acc:230, max:150, flapCd:0.34, next:'hunter' },
  hunter:  { name:'Crypto Miner',  color:'#dfe3ee', pts:750,  acc:300, max:195, flapCd:0.26, next:'shadow' },
  shadow:  { name:'Rival Silicon', color:'#3aa0ff', pts:1500, acc:420, max:255, flapCd:0.18, next:'shadow' },
};
const BOSSES = {
  elon: { name:'ELON', title:'THE ROCKETEER', color:'#ff5a5a', lance:'#f4f6fb', hp:5, acc:320, max:230, flapCd:0.22, wave:3, blurb:'rides a rocket, telegraphs, then dashes',
    quips:['To Mars! Via your face.', 'Launch in 3…2…1', 'Full self-jousting.', 'Ship the rocket, then iterate.'] },
  bill: { name:'BILL', title:'THE WINDOWS WIZARD', color:'#3aa0ff', lance:'#8fd0ff', hp:5, acc:280, max:205, flapCd:0.24, wave:6, blurb:'teleports in above you to win the height',
    quips:['Have you tried restarting?', 'Updating… 2%', 'Ctrl+Alt+Joust.', 'Your lance is not responding.'] },
  jeff: { name:'JEFF', title:'THE PRIME COURIER', color:'#ffa31a', lance:'#ffc266', hp:5, acc:290, max:215, flapCd:0.22, wave:9, blurb:'drops packages and calls in backup',
    quips:['Delivered in one day.', 'It’s always Day One.', 'Your package is on the way.', 'Free shipping. No returns.'] },
};
BOSSES.jensen = { name:'JENSEN', title:'THE LEATHER JACKET', color:'#a6ff3d', lance:'#d8ff9a', hp:8, acc:340, max:235, flapCd:0.2, wave:12, blurb:'FINAL BOSS · overclocks and summons GPU minions',
  quips:['The more you buy, the more you save.', 'Accelerated computing!', 'Leather stays on.', 'This keynote has 400 slides.', 'Every pixel is generated.'] };
const BOSS_SCALE = 1.35;
const PLAYER_REPLIES = { elon:'Let’s test your Starlink latency.', bill:'Rolling back your update.', jeff:'Return to sender.', jensen:'Your GPUs are useless without my network.' };
const PLAYER_WINS = { elon:'Houston, you have a problem.', bill:'Blue screen for you.', jeff:'Package delivered.', jensen:'Packet loss: 100%. GG.' };
const BOSS_OUCH = ['Ouch.', 'Recalculating…', 'That was a beta lance.', 'Not in the roadmap.'];
const EGG_PTS = [250, 500, 750, 1000];
const THROW_QUIPS = ['Catch!', 'Yeet the packet!', 'Fire and forget.', 'Sending it!', 'Hot-swap incoming!'];
const LANCE_RANGE_T = 0.75, LANCE_SPEED = 600, RMA_T = 5;
const QUIPS_WAVE = ['Pushing config…', 'It’s always DNS.', 'Ansible, take the wheel.', 'Idempotent and ready.', 'Have you checked the MTU?', 'BGP has converged.', 'Change window is open.'];
const OFFS = [-W, 0, W];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const wrapX = x => ((x % W) + W) % W;
const wdx = (a, b) => { let d = b - a; if (d > W / 2) d -= W; if (d < -W / 2) d += W; return d; };

// ---------- audio ----------
let AC = null, muted = false;
try { muted = localStorage.getItem('aspath-muted') === '1'; } catch (e) { muted = false; }
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', v = 0.06, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.03);
}
const sfx = {
  flap: () => tone(190, 0.06, 'square', 0.035, 120),
  clang: () => { tone(1500, 0.2, 'triangle', 0.08, 900); tone(2300, 0.12, 'square', 0.025, 1600); },
  win: () => { tone(260, 0.14, 'sawtooth', 0.06, 880); },
  egg: n => { const b = 520 + n * 110; tone(b, 0.07, 'square', 0.05); tone(b * 1.5, 0.1, 'square', 0.045, null, 0.07); },
  die: () => tone(520, 0.7, 'sawtooth', 0.08, 50),
  wave: () => [392, 523, 659, 784].forEach((f, i) => tone(f, 0.14, 'square', 0.045, null, i * 0.1)),
  hatch: () => tone(90, 0.3, 'sawtooth', 0.06, 260),
  wyvern: () => { tone(900, 0.6, 'sawtooth', 0.05, 180); tone(1200, 0.4, 'square', 0.02, 300, 0.1); },
  grab: () => tone(70, 0.6, 'sawtooth', 0.1, 35),
  bump: () => tone(260, 0.04, 'triangle', 0.03),
  life: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.1, 'square', 0.04, null, i * 0.07)),
  throw: () => { tone(900, 0.18, 'sawtooth', 0.05, 220); tone(1400, 0.1, 'square', 0.02, 500); },
  thunk: () => tone(160, 0.09, 'square', 0.06, 70),
  siren: () => [0, 0.32, 0.64].forEach(d => { tone(440, 0.16, 'square', 0.045, 880, d); tone(880, 0.16, 'square', 0.045, 440, d + 0.16); }),
};
// announcer: the browser's built-in text-to-speech (a generic system voice, never an imitation of a real person)
function announce(text) {
  if (muted || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; u.pitch = 0.55; u.volume = 0.9; speechSynthesis.speak(u); } catch (e) { /* no speech available */ }
}

// ---------- persistence ----------
let hiscore = 0;
try { hiscore = +localStorage.getItem('tensor-tilt-hi') || 0; } catch (e) { hiscore = 0; }
function saveHi() { try { localStorage.setItem('tensor-tilt-hi', String(hiscore)); } catch (e) { /* storage blocked */ } }

// ---------- arena ----------
function makePlatforms(bridge) {
  const p = [
    { x:0,     y:540, w:GAP_L,     h:60, floor:1, pad:125 },
    { x:GAP_R, y:540, w:W - GAP_R, h:60, floor:1, pad:835 },
    { x:0,   y:160, w:120, h:14 },
    { x:860, y:160, w:100, h:14 },
    { x:340, y:130, w:220, h:14, pad:450 },
    { x:190, y:292, w:170, h:14, pad:275 },
    { x:630, y:272, w:150, h:14 },
    { x:0,   y:405, w:150, h:14 },
    { x:815, y:405, w:145, h:14 },
    { x:405, y:425, w:150, h:14, pad:480 },
  ];
  if (bridge) p.push({ x:GAP_L, y:540, w:GAP_R - GAP_L, h:18, bridge:1 });
  return p;
}
let plats = makePlatforms(true), bridge = true;
const pads = () => plats.filter(p => p.pad).map(p => ({ x:p.pad, y:p.y }));

// ---------- physics ----------
function overlapsX(e, p, off) { const l = e.x - e.w / 2, r = e.x + e.w / 2; return r > p.x + off + 0.01 && l < p.x + off + p.w - 0.01; }
function stepBody(e, dt, ax, acc, max) {
  const fric = e.fric ?? 6;
  e.landed = false;
  if (e.grounded) {
    if (ax) { e.vx += ax * acc * 1.5 * dt; if (Math.sign(e.vx) !== ax && Math.abs(e.vx) > 50) e.skid = 0.18; }
    else { e.vx -= e.vx * Math.min(1, dt * fric); if (Math.abs(e.vx) > 70 && fric > 3) e.skid = 0.12; if (Math.abs(e.vx) < 4) e.vx = 0; }
  } else if (ax) e.vx += ax * acc * dt;
  e.vx = clamp(e.vx, -max, max);
  if (ax) e.face = ax;
  if (!e.grounded) e.vy = clamp(e.vy + G * dt, MAX_UP, MAX_DOWN);
  e.skid = Math.max(0, (e.skid || 0) - dt);

  // horizontal move + side bounces
  let hit = false;
  e.x += e.vx * dt;
  for (const p of plats) for (const off of OFFS) {
    if (!overlapsX(e, p, off)) continue;
    const t = e.y - e.h / 2, b = e.y + e.h / 2;
    if (b <= p.y + 0.5 || t >= p.y + p.h - 0.5) continue;
    if (e.x < p.x + off + p.w / 2) e.x = p.x + off - e.w / 2 - 0.1; else e.x = p.x + off + p.w + e.w / 2 + 0.1;
    e.vx = -e.vx * 0.75; hit = true;
  }
  e.x = wrapX(e.x);

  // vertical move + landing / underside bounce
  const prevT = e.y - e.h / 2, prevB = e.y + e.h / 2;
  if (e.grounded) {
    let sup = false;
    for (const p of plats) for (const off of OFFS) if (overlapsX(e, p, off) && Math.abs(prevB - p.y) < 1) sup = true;
    if (!sup) { e.grounded = false; e.vy = 0; }
  }
  if (!e.grounded) {
    e.y += e.vy * dt;
    for (const p of plats) for (const off of OFFS) {
      if (!overlapsX(e, p, off)) continue;
      const t = e.y - e.h / 2, b = e.y + e.h / 2;
      if (e.vy >= 0 && prevB <= p.y + 1 && b > p.y) { e.y = p.y - e.h / 2; e.vy = 0; e.grounded = true; e.landed = true; }
      else if (e.vy < 0 && prevT >= p.y + p.h - 1 && t < p.y + p.h) { e.y = p.y + p.h + e.h / 2; e.vy = Math.abs(e.vy) * 0.45; hit = true; }
    }
  }
  if (e.y - e.h / 2 < 0) { e.y = e.h / 2; e.vy = Math.abs(e.vy) * 0.5; hit = true; }
  return hit;
}
function flap(e) { e.vy = Math.max(MAX_UP, (e.grounded ? 0 : e.vy) - FLAP_V); e.grounded = false; e.wingT = 0.16; }
function aabb(a, b, shrink = 0) { return Math.abs(wdx(a.x, b.x)) < (a.w + b.w) / 2 - shrink && Math.abs(a.y - b.y) < (a.h + b.h) / 2 - shrink; }
const inLava = e => e.y + e.h / 2 > LAVA_TOP + 4;

// ---------- state ----------
let state = 'title', paused = false, T = 0;
let score = 0, lives = 4, wave = 0, waveType = 'standard', waveTime = 0, survivalOK = true, eggChain = 0, nextLife = 20000;
let player = null, enemies = [], eggs = [], ghosts = [], parts = [], pops = [];
let thrown = null, rmaT = 0, throwQueued = false;
let wyvern = null, wyvernCount = 0, trollCd = 0, banner = null, quip = null, spawnQueue = [], spawnTimer = 0, nextWaveT = 0, shake = 0, overT = 0, boxes = [];

function addScore(n, x, y, label, color = ACC) {
  score += n;
  pops.push({ x, y, text: label ? `${label} +${n}` : `+${n}`, life: 1.2, color });
  if (score >= nextLife) { nextLife += 20000; lives++; sfx.life(); pops.push({ x, y: y - 18, text: 'EXTRA LIFE', life: 1.6, color: '#ffd23f' }); }
  if (score > hiscore) hiscore = score;
}
function burst(x, y, color, n = 18, sp = 160, g = 300) {
  for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), s = rand(sp * 0.3, sp); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rand(0.4, 0.9), max: 0.9, color, size: rand(1.5, 3.5), g }); }
}
function say(text, t = 1.8) { quip = { text, t }; }
function setBanner(text, sub, t = 2.4, color = null) { banner = { text, sub, t, max: t, color }; }

function spawnPlayer() {
  const ps = pads();
  let best = ps[0], bestD = -1;
  for (const p of ps) { let d = 9999; for (const e of enemies) d = Math.min(d, Math.hypot(wdx(p.x, e.x), p.y - e.y)); d += rand(0, 80); if (d > bestD) { bestD = d; best = p; } }
  player = { x: best.x, y: best.y - 19, w: 34, h: 38, vx: 0, vy: 0, face: 1, grounded: true, inv: 4, mat: 0.7, dead: false, respawn: 0, wingT: 0, run: 0, grab: null, armed: true };
  thrown = null; rmaT = 0;
  burst(player.x, player.y, ACC, 22, 120, 0);
}
function killPlayer(why) {
  const P = player; if (P.dead) return;
  P.dead = true; P.grab = null; P.respawn = 2; lives--; survivalOK = false; shake = 7; quip = null;
  burst(P.x, P.y, why === 'lava' ? '#ff7a2a' : '#ffffff', 34, 260); burst(P.x, P.y, ACC, 16, 200);
  sfx.die();
}
function newGame() {
  ensureAudio();
  score = 0; lives = 4; nextLife = 20000; enemies = []; eggs = []; ghosts = []; parts = []; pops = []; wyvern = null; boxes = []; nextWaveT = 0; thrown = null; rmaT = 0;
  bridge = true; plats = makePlatforms(true); state = 'play'; paused = false;
  startWave(1); spawnPlayer();
}
function startWave(n) {
  wave = n; waveTime = 0; survivalOK = true; eggChain = 0; wyvern = null; wyvernCount = 0; spawnQueue = []; spawnTimer = 0.4;
  const keepBridge = n < 4;
  if (bridge && !keepBridge) {
    for (let x = GAP_L; x < GAP_R; x += 6) parts.push({ x, y: 545, vx: rand(-30, 30), vy: rand(-220, -60), life: rand(0.6, 1.4), max: 1.4, color: Math.random() < 0.5 ? '#ff7a2a' : '#ffd23f', size: rand(2, 4), g: 260 });
  }
  const burnedNow = bridge && !keepBridge;
  bridge = keepBridge; plats = makePlatforms(bridge);
  const kind = waveKind(n); waveType = kind.type; boxes = [];
  if (kind.bosses) {
    const hp = BOSSES[kind.bosses[0]].hp + (kind.rematch ? 2 : 0);
    kind.bosses.forEach(b => spawnQueue.push({ boss: b, hp }));
    if (kind.type === 'boss') { const m = { elon: 'bounder', bill: 'hunter', jeff: null, jensen: null }[kind.bosses[0]]; if (m) spawnQueue.push(m, m); }
    const B = BOSSES[kind.bosses[0]], who = `${B.name[0]}${B.name.slice(1).toLowerCase()}, ${B.title.toLowerCase()}`;
    if (kind.type === 'final') {
      setBanner('FINAL BOSS: JENSEN', 'The leather jacket himself. Hit him from above 8 times.', 3.8, B.color);
      setTimeout(() => announce(`Final wave! ${who}, has entered the data center!`), 900);
    } else {
      setBanner(`${B.name} — ${B.title}`, burnedNow ? 'Boss fight over open lava. Hit him from above.' : 'Boss fight: hit him from above, or throw your lance', 3.6, B.color);
      setTimeout(() => announce(`Wave ${n}. Warning! ${who}, is entering the arena!`), 900);
    }
  } else if (waveType === 'egg') {
    const spots = plats.filter(p => !p.bridge);
    const count = Math.min(10, 6 + Math.floor(n / 5));
    for (let i = 0; i < count; i++) {
      const p = spots[i % spots.length];
      const x = p.x + rand(18, p.w - 18);
      eggs.push({ x, y: p.y - 7, w: 16, h: 14, vx: 0, vy: 0, grounded: true, fric: 1.2, t: 0, hatchAt: 11 + i * 1.3, tier: 'shadow' });
    }
    setBanner(`WAVE ${n}`, 'EGG WAVE — grab every die before it reboots');
  } else {
    const count = Math.min(8, 3 + Math.floor((n - 1) * 0.7));
    const sh = clamp((n - 5) * 0.08, 0, 0.6), hu = clamp((n - 2) * 0.17, 0, 0.75);
    for (let i = 0; i < count; i++) { const r = (i + 0.5) / count; spawnQueue.push(r < sh ? 'shadow' : r < sh + hu ? 'hunter' : 'bounder'); }
    spawnQueue.sort(() => Math.random() - 0.5);
    setBanner(`WAVE ${n}`, burnedNow ? 'The bridge has melted. Mind the lava.' : waveType === 'survival' ? 'SURVIVAL WAVE — 3000 bonus if you don’t die' : 'Prepare to joust');
  }
  if (kind.bosses) sfx.siren(); else sfx.wave();
  if (player && !player.dead) say(kind.bosses ? PLAYER_REPLIES[kind.bosses[0]] : QUIPS_WAVE[(n - 1) % QUIPS_WAVE.length]);
}
// waves 3/6/9 are boss fights, 12 is the final battle; after that, endless with a boss rematch every 4th wave
function waveKind(n) {
  const sched = { 3: 'elon', 6: 'bill', 9: 'jeff' };
  if (n <= 12) {
    if (sched[n]) return { type: 'boss', bosses: [sched[n]] };
    if (n === 12) return { type: 'final', bosses: ['jensen'] };
  } else if (n % 4 === 0) return { type: 'boss', bosses: [['elon', 'bill', 'jeff', 'jensen'][(n / 4) % 4]], rematch: true };
  return { type: n % 5 === 0 ? 'egg' : n % 5 === 2 ? 'survival' : 'standard' };
}
function spawnEnemy(tier) {
  const ps = pads(); let best = ps[0], bestD = -1;
  for (const p of ps) { const d = player && !player.dead ? Math.hypot(wdx(p.x, player.x), p.y - player.y) + rand(0, 120) : rand(0, 100); if (d > bestD) { bestD = d; best = p; } }
  if (typeof tier === 'object') {
    enemies.push({ boss: tier.boss, hp: tier.hp, maxHp: tier.hp, tier: 'shadow', x: best.x, y: best.y - 25.5, w: 46, h: 51, lance: LANCE * BOSS_SCALE,
      vx: 0, vy: 0, face: Math.random() < 0.5 ? -1 : 1, grounded: true, state: 'mat', t: 0, flapCd: 0, noHit: 0, wingT: 0, run: 0, dir: 1,
      mode: 'chase', modeT: 3, spT: rand(3, 5), dropT: 2, deliverT: 8, tele: 0, dash: 0, oc: 0, tp: null, quip: null, alpha: 1, intro: false });
    return;
  }
  enemies.push({ tier, x: best.x, y: best.y - 19, w: 34, h: 38, vx: 0, vy: 0, face: Math.random() < 0.5 ? -1 : 1, grounded: true, state: 'mat', t: 0, flapCd: 0, phase: rand(0, 6), baseY: rand(110, 420), dir: Math.random() < 0.5 ? -1 : 1, turnT: rand(2, 6), noHit: 0, wingT: 0, run: 0 });
}

// ---------- updates ----------
// ---------- the thrown lance ----------
function throwLance(P) {

function update(dt) {
  T += dt;
  const flapPressed = flapQueued > 0; if (flapQueued > 0) flapQueued--;

  updateFx(dt);

  if (state !== 'play') return;
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  waveTime += dt; trollCd -= dt; shake = Math.max(0, shake - dt * 20);
  if (spawnQueue.length) { spawnTimer -= dt; if (spawnTimer <= 0) { spawnEnemy(spawnQueue.shift()); spawnTimer = 0.7; } }
  updatePlayer(dt, flapPressed, throwPressed);
  for (const e of enemies) updateEnemy(e, dt);
  updateThrown(dt); lanceHits();
  for (const g of eggs) updateEgg(g, dt);
  for (const b of boxes) {
    b.t += dt; const vyb = b.vy; stepBody(b, dt, 0, 0, 300);
    if (b.landed && vyb > 120) { b.grounded = false; b.vy = -vyb * 0.3; }
    if (b.t > 7 || inLava(b)) b.gone = true;
  }
  updateWyvern(dt);
  collisions();
  enemies = enemies.filter(e => !e.gone); eggs = eggs.filter(g => !g.gone); boxes = boxes.filter(b => !b.gone);
  if (state === 'play' && !nextWaveT && !spawnQueue.length && !enemies.length && !eggs.length && waveTime > 1) {
    wyvern = null; boxes = [];
    if (waveType === 'final') {
      addScore(25000, W / 2, 300, 'TRIUMPH', '#ffd23f');
      state = 'win'; overT = 0; saveHi(); sfx.life(); setTimeout(sfx.wave, 500);
      return;
    }
    nextWaveT = 2.6;
    if (waveType === 'survival' && survivalOK) { addScore(3000, W / 2, 300, 'SURVIVAL BONUS', '#ffd23f'); }
    setBanner('WAVE CLEAR', waveType === 'survival' && survivalOK ? 'Survival bonus 3000' : 'Next wave incoming', 2.2);
    if (player && !player.dead) say('Change window closed.');
  }
  if (nextWaveT) { nextWaveT -= dt; if (nextWaveT <= 0) { nextWaveT = 0; startWave(wave + 1); } }
}

}
function drawWin() {
  ctx.fillStyle = 'rgba(6,7,13,0.72)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center';
  ctx.save(); ctx.shadowColor = ACC; ctx.shadowBlur = 24;
  ctx.font = '40px "Press Start 2P", monospace'; ctx.fillStyle = ACC; ctx.fillText('VICTORY', W / 2, 170); ctx.restore();
  ctx.save(); ctx.translate(W / 2, 270); ctx.scale(3.2, 3.2); drawEngineer(0, 0, 1, { grounded: false, t: T, wing: Math.sin(T * 6) > 0.3 }); ctx.restore();
  ctx.font = '600 20px "Chakra Petch", system-ui, sans-serif'; ctx.fillStyle = '#e7ebf5';
  ctx.fillText('Elon, Bill, Jeff and Jensen are down. The network team rules the sky.', W / 2, 370);
  ctx.fillStyle = '#9aa3bf'; ctx.font = '600 17px "Chakra Petch", system-ui, sans-serif';
  ctx.fillText(`Score ${score.toLocaleString()}`, W / 2, 398);
  if (overT > 1.5 && Math.floor(T * 2) % 2) { ctx.font = '12px "Press Start 2P", monospace'; ctx.fillStyle = '#ffd23f'; ctx.fillText(coarse ? 'TAP FOR ENDLESS MODE' : 'PRESS ENTER FOR ENDLESS MODE', W / 2, 450); }
}
function render() {
  ctx.save();
  if (shake > 0 && !REDUCED) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.drawImage(bg, 0, 0, W, H);
  drawLava(); drawPlats();
  for (const g of eggs) drawEgg(g);
  for (const b of boxes) drawBox(b);
  for (const g of ghosts) drawDrone(g.x, g.y, g.face, Math.sin(g.t * 20) > 0, false, 0, T);
  for (const e of enemies) drawEnemy(e);
  if (state !== 'title') { drawThrown(); drawTroll(); drawPlayer(); }
  if (wyvern) wrapped(wyvern.x, 60, x => drawWyvern({ ...wyvern, x }));
  for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = '10px "Press Start 2P", monospace';
  for (const p of pops) { ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;
  drawHUD();
  if (state === 'play') { drawRoster(); drawBossBars(); drawBanner(); }
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (state === 'win') drawWin();
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(6,7,13,0.6)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center';
    ctx.font = '28px "Press Start 2P", monospace'; ctx.fillStyle = ACC; ctx.fillText('PAUSED', W / 2, 290);
    ctx.font = '600 16px "Chakra Petch", system-ui, sans-serif'; ctx.fillStyle = '#c4cbe0'; ctx.fillText(coarse ? 'Tap to resume' : 'Press P to resume', W / 2, 320);
  }
  ctx.restore();
}

// ---------- input ----------
const keys = { left: false, right: false };
let flapQueued = 0;
const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
const FLAPKEYS = new Set(['Space', 'ArrowUp', 'KeyW', 'KeyZ']);
const THROWKEYS = new Set(['KeyX', 'ShiftLeft', 'ShiftRight']);
function queueThrow() { if (state === 'play' && !paused) throwQueued = true; }
function startOrFlap() {
  ensureAudio();
  if (state === 'title' || (state === 'over' && overT > 1)) { newGame(); return; }
  if (state === 'win') { if (overT > 1.5) { state = 'play'; startWave(wave + 1); } return; }
  if (state === 'play' && !paused) flapQueued = Math.min(flapQueued + 1, 3);
}
addEventListener('keydown', ev => {
  if (KEYMAP[ev.code] || FLAPKEYS.has(ev.code) || THROWKEYS.has(ev.code) || ev.code === 'ArrowDown') ev.preventDefault();
  ensureAudio();
  if (KEYMAP[ev.code]) keys[KEYMAP[ev.code]] = true;
  else if (THROWKEYS.has(ev.code)) { if (!ev.repeat) queueThrow(); }
  else if (FLAPKEYS.has(ev.code)) { if (!ev.repeat) startOrFlap(); }
  else if (ev.code === 'Enter') { if (state !== 'play') startOrFlap(); }
  else if (ev.code === 'KeyP' || ev.code === 'Escape') { if (state === 'play') paused = !paused; }
  else if (ev.code === 'KeyM') { muted = !muted; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); try { localStorage.setItem('aspath-muted', muted ? '1' : '0'); } catch (e) { /* storage blocked */ } }
});
addEventListener('keyup', ev => { if (KEYMAP[ev.code]) keys[KEYMAP[ev.code]] = false; });
addEventListener('blur', () => { keys.left = keys.right = false; });
cv.addEventListener('pointerdown', () => { cv.focus(); if (paused) { paused = false; return; } if (state !== 'play') startOrFlap(); });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const down = ev => { ev.preventDefault(); b.classList.add('on'); try { b.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ } if (k === 'flap') startOrFlap(); else if (k === 'throw') { ensureAudio(); queueThrow(); } else keys[k] = true; };
  const up = () => { b.classList.remove('on'); if (k === 'left' || k === 'right') keys[k] = false; };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

// ---------- loop ----------
const STEP = 1 / 120;
let accT = 0, last = performance.now();
function frame(now) {
  const d = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) { accT += d; while (accT >= STEP) { update(STEP); accT -= STEP; } }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
